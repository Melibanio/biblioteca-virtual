<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Biblioteca Virtual</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-pagina="cadastro">
    <main>
        <div class="titulo-pagina">
            <h1>Criar conta</h1>
            <p>Cadastre-se para guardar seus livros favoritos.</p>
        </div>
        <div class="caixa">
            <p class="msg" id="msg" role="alert" tabindex="-1"></p>
            <form id="form-cadastro" novalidate>
                <div class="campo"><label for="nome">Nome completo</label><input id="nome" name="nome"
                        autocomplete="name" required></div>
                <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email"
                        autocomplete="email" required></div>
                <div class="campo"><label for="tipo">Perfil</label><select id="tipo" name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="estudante">Estudante</option>
                        <option value="professor">Professor(a)</option>
                    </select></div>
                <div class="campo"><label for="senha">Senha (mínimo de 8 caracteres)</label><input id="senha"
                        name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
                <div class="campo"><label for="confirmar">Confirmar senha</label><input id="confirmar" name="confirmar"
                        type="password" minlength="8" autocomplete="new-password" required></div>
                <button class="btn" type="submit">Criar conta</button>
            </form>
            <p class="rodape-form">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
