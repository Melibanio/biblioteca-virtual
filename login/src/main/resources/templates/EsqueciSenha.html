<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Biblioteca Virtual</title>
    <link rel="stylesheet" th:href="@{/Login-cadastro-esqueciSenha.css}">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <h1>Biblioteca <span>Virtual</span></h1>
            <p>Acesse livros gratuitos e amplie seus conhecimentos em um só lugar.</p>
        </div>
        <nav>
            <a th:href="@{/login}">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main class="pagina">
        <section class="area-formulario">
            <div class="abaLogin">
                <h2>Redefinir senha</h2>
                <p class="descricao">
                    Informe o e-mail cadastrado e digite sua nova senha duas vezes para confirmar.
                </p>

                <p class="mensagem erro" th:if="${erro}" th:text="${erro}"></p>
                <form th:action="@{/usuarios/recuperar-senha}" method="post">
                    <div class="campo">
                        <label for="emailRecuperacao">Endereço de e-mail</label>
                        <input
                            type="email"
                            id="emailRecuperacao"
                            name="email"
                            placeholder="Digite seu e-mail cadastrado"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="campo">
                        <label for="novaSenha">Nova senha</label>
                        <input
                            type="password"
                            id="novaSenha"
                            name="novaSenha"
                            placeholder="Digite sua nova senha"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">Confirmar nova senha</label>
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                    </div>

                    <button type="submit">Salvar nova senha</button>
                </form>

                <p class="voltar-login"><a th:href="@{/login}">Voltar para o login</a></p>
            </div>
        </section>
    </main>

    <footer>
        <span>© 2026 Biblioteca Virtual</span>
        <span class="separador"> | </span>
        <a href="#sobre">Sobre o projeto</a>
        <span class="separador"> | </span>
        <a href="#contato">Contato</a>
    </footer>
</body>

</html>
